name: Release

env:
  PACKAGE_NAME: httptap
  CHANGELOG_FILE: CHANGELOG.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version (e.g., 0.3.0) - leave empty to use bump"
        required: false
        type: string
      bump:
        description: "Bump type (used if version is empty)"
        required: false
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Creates the signed release commit and tag locally and hands them on as a
  # git bundle. Nothing is pushed until the build job has tested that exact
  # tree (see push-release), so a failing release leaves no tag on main and
  # publishes nothing.
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # push-release fast-forwards the dispatching branch; releases are cut from main only.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read # Required for repository checkout
      id-token: write # Required for gitsign keyless Sigstore OIDC signing
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.text }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitsign (Sigstore keyless git signing)
        uses: chainguard-dev/actions/setup-gitsign@805da2efdffdc42b8afd8880e575a48b471ef544 # v1.6.37

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git config --global gpg.x509.program gitsign
          git config --global gpg.format x509
          git config --global tag.gpgsign true
          git config --global commit.gpgsign true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: uv.lock
          enable-cache: false

      - name: Update project version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "Using explicit version: ${VERSION}"
            uv version "${VERSION}"
          else
            BUMP="$INPUT_BUMP"
            echo "Bumping version: ${BUMP}"
            uv version --bump "${BUMP}"
            VERSION=$(uv version --short)
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Final version: ${VERSION}"

      - name: Refresh lockfile
        run: uv lock

      - name: Update CITATION.cff metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          yq -i ".version = \"${VERSION}\" | .\"date-released\" = \"${DATE}\"" CITATION.cff

      - name: Add release to OpenVEX fixed statements
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Every fixed vulnerability stays fixed in the new release, so its
          # purl joins the products of each "fixed" statement. The document
          # version and timestamps only move when something actually changed,
          # which keeps a re-run for the same version a no-op.
          VEX=.vex/httptap.openvex.json
          jq --arg purl "pkg:pypi/${PACKAGE_NAME}@${VERSION}" \
             --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            . as $orig
            | .statements |= map(
                if .status == "fixed" and (any(.products[]; .["@id"] == $purl) | not)
                then .products += [{"@id": $purl}] | .timestamp = $now
                else . end)
            | if . == $orig then . else .version += 1 | .timestamp = $now end
          ' "$VEX" > "${RUNNER_TEMP}/openvex.json"
          mv "${RUNNER_TEMP}/openvex.json" "$VEX"
          git diff --stat -- "$VEX"

      - name: Ensure changelog exists
        run: touch "${CHANGELOG_FILE}"

      - name: Generate changelog entry
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Generate full changelog and prepend to CHANGELOG.md
          uv run --locked --only-group release git-cliff --config .release/git-cliff.toml --tag "${TAG}" --unreleased --prepend "${CHANGELOG_FILE}"
          # Extract release notes for the new version.
          # We cannot use --latest here because the tag does not exist in git
          # yet (it is created in a later step); --latest would fall back to
          # the previous release and embed stale notes in the GitHub release.
          NOTES=$(uv run --locked --only-group release git-cliff --config .release/git-cliff.toml --tag "${TAG}" --unreleased --strip header)
          {
            echo "text<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit release changes
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add pyproject.toml uv.lock CITATION.cff .vex/httptap.openvex.json "${CHANGELOG_FILE}"
          git commit -S -m "chore: release v${VERSION}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create signed tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git tag -s "${TAG}" -m "Release ${TAG}"

      - name: Bundle release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git bundle create release.bundle "^${GITHUB_SHA}" HEAD "refs/tags/${TAG}"
          git bundle verify release.bundle

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release.bundle
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prepare
    permissions:
      contents: read # Required for repository checkout

    steps:
      - name: Checkout release base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release

      - name: Check out the unpushed release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BUNDLE: ${{ runner.temp }}/release/release.bundle
        run: |
          git fetch "${BUNDLE}" "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout --detach "${TAG}"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: uv.lock
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --locked --no-dev --group test

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Build distribution
        run: uv build

      - name: Validate distribution metadata
        run: uv run --locked --only-group release twine check dist/*

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl httptap --version

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error

      - name: Prepare SBOM inputs
        # The SBOM describes what users install (the wheel and its runtime
        # dependencies), not the build environment with test tooling.
        run: |
          mkdir -p sbom
          uv venv "${RUNNER_TEMP}/sbom-env"
          uv pip install --python "${RUNNER_TEMP}/sbom-env" dist/*.whl

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: ${{ env.PACKAGE_NAME }}-${{ needs.prepare.outputs.version }}.cdx.json
          path: ${{ runner.temp }}/sbom-env
          format: cyclonedx-json
          output-file: sbom/${{ env.PACKAGE_NAME }}-${{ needs.prepare.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: ${{ env.PACKAGE_NAME }}-${{ needs.prepare.outputs.version }}.spdx.json
          path: ${{ runner.temp }}/sbom-env
          format: spdx-json
          output-file: sbom/${{ env.PACKAGE_NAME }}-${{ needs.prepare.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach VEX document
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # OpenVEX is kept in-tree under .vex/ so every commit tracks
          # the current exploitability assessment. Rename-copy the file
          # with the release version embedded so the published artifact
          # is self-identifying.
          VEX=.vex/httptap.openvex.json
          if ! jq -e --arg purl "pkg:pypi/${PACKAGE_NAME}@${VERSION}" \
            '[.statements[] | select(.status == "fixed")] | all(any(.products[]; .["@id"] == $purl))' \
            "$VEX" > /dev/null; then
            echo "::error file=${VEX}::A fixed statement does not list pkg:pypi/${PACKAGE_NAME}@${VERSION}"
            exit 1
          fi
          cp "$VEX" "sbom/${PACKAGE_NAME}-${VERSION}.openvex.json"

      - name: Generate man page
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p man
          uv run --locked --no-dev --group release argparse-manpage \
            --module httptap.cli \
            --function create_parser \
            --project-name httptap \
            --version "${VERSION}" \
            --author "Sergei Ozeranskii" \
            --author-email "noreply@httptap.dev" \
            --url "https://github.com/ozeranskii/httptap" \
            --manual-title "httptap" \
            --output "man/${PACKAGE_NAME}.1"
          gzip --best "man/${PACKAGE_NAME}.1"

      - name: Upload man-page artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: man
          path: man/
          retention-days: 7
          if-no-files-found: error

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          retention-days: 7
          if-no-files-found: error

  attest:
    name: Attest Build Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    permissions:
      id-token: write # Required for Sigstore OIDC signing via attest-build-provenance
      attestations: write # Required for generating build provenance attestations

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  # The only job that writes to the git repository, through the deploy key of
  # the release environment rather than the workflow token. It runs after the
  # release tree was tested and built, and the push is fast-forward only and
  # atomic: if main moved during the release, neither the branch nor the tag
  # is updated and nothing is published.
  push-release:
    name: Push Release Commit and Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    needs:
      - prepare
      - build
      - attest
    permissions:
      contents: read # The push goes over SSH with the deploy key

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          persist-credentials: true

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release

      - name: Push release commit and tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BUNDLE: ${{ runner.temp }}/release/release.bundle
        run: |
          git fetch "${BUNDLE}" "refs/tags/${TAG}:refs/tags/${TAG}"
          git push --atomic origin \
            "refs/tags/${TAG}^{commit}:refs/heads/${GITHUB_REF_NAME}" \
            "refs/tags/${TAG}:refs/tags/${TAG}"

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - prepare
      - build
      - attest
      - push-release
    environment:
      name: testpypi
      url: https://test.pypi.org/project/${{ env.PACKAGE_NAME }}/
    permissions:
      id-token: write # Required for TestPyPI OIDC trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - prepare
      - build
      - publish-testpypi
    environment:
      name: pypi
      url: https://pypi.org/project/${{ env.PACKAGE_NAME }}/
    permissions:
      id-token: write # Required for PyPI OIDC trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations are signed via Sigstore OIDC and
          # surfaced on the PyPI project page as "Verified publisher".
          attestations: true

  publish-container:
    name: Publish container image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gated on PyPI, so the image is only published once the release has
    # passed the pypi environment's required review.
    needs:
      - prepare
      - push-release
      - publish-pypi
    permissions:
      contents: read
      packages: write # Push to ghcr.io/<owner>/<repo>
      id-token: write # Sigstore OIDC for keyless cosign signing
      attestations: write # GitHub build provenance attestations

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive container tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless Sigstore)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attach SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Required for creating GitHub releases
    needs:
      - prepare
      - build
      - publish-pypi
      - publish-container

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/

      - name: Download man-page artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: man
          path: man/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NOTES: ${{ needs.prepare.outputs.notes }}
          REPO: ${{ github.repository }}
        run: |-
          gh release create "$TAG" \
            dist/* sbom/* man/* \
            --repo "$REPO" \
            --title "$TAG" \
            --notes "$NOTES"
