name: CodSpeed

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - '**/*.md'
      - mkdocs.yml
  pull_request:
    branches:
      - main
    paths-ignore:
      - docs/**
      - '**/*.md'
      - mkdocs.yml
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes a pull request's run. Every other run gets its own
# group: GitHub drops a pending run when another one queues in the same
# group, so sharing one would still skip some commits on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required for CodSpeed OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev --group test

      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation,memory
          run: uv run --no-dev --group test pytest -o "addopts=--strict-markers --strict-config" tests/test_benchmarks.py
            --codspeed --no-cov
