name: Pre-commit policy validation

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

# A new push supersedes a pull request's run. Every other run gets its own
# group: GitHub drops a pending run when another one queues in the same
# group, so sharing one would still skip some commits on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit-policy-check:
    name: Validate pre-commit config & hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: uv.lock
          enable-cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Sync only precommit dependencies
        run: |
          uv sync --locked --no-dev --group precommit
          uv run pre-commit --version

      - name: Validate pre-commit config
        run: uv run pre-commit validate-config

      - name: Run pre-commit hooks
        env:
          SKIP: ruff-check,ruff-format,mypy
        run: uv run pre-commit run --all-files --show-diff-on-failure
