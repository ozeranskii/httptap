name: zizmor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

# A new push supersedes a pull request's run. Every other run gets its own
# group: GitHub drops a pending run when another one queues in the same
# group, so sharing one would still skip some commits on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: GitHub Actions Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write # Required for uploading SARIF results
      contents: read # Required for repository checkout
      actions: read # Required for workflow analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: pedantic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
