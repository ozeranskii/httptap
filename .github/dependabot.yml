version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    target-branch: "main"
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    target-branch: "main"
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      base-images:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    target-branch: "main"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dev-tools:
        patterns:
          - "ruff"
          - "mypy"
        update-types:
          - "minor"
          - "patch"
      test-dependencies:
        patterns:
          - "pytest*"
          - "faker"
          - "hypothesis"
        update-types:
          - "minor"
          - "patch"
      docs:
        patterns:
          - "mkdocs*"
          - "pymdown-extensions"
        update-types:
          - "minor"
          - "patch"
      http-client:
        patterns:
          - "httpx*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pre-commit"
    target-branch: "main"
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: "auto"
