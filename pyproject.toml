[project]
name = "httptap"
version = "0.8.0"
description = "HTTP request visualizer with detailed timing breakdown (DNS → TCP → TLS → HTTP)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "Sergei Ozeranskii" },
]
maintainers = [
    { name = "Sergei Ozeranskii" },
]

keywords = [
    "http",
    "https",
    "performance",
    "timing",
    "dns",
    "tls",
    "ssl",
    "networking",
    "monitoring",
    "diagnostics",
    "waterfall",
    "curl",
    "httpx",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
]

dependencies = [
    "httpx[http2,socks]>=0.28.1",
    "httpcore>=1.0.0",
    "rich>=14.3.2",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
completion = [
    "argcomplete>=3.7.2",
]
otel = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.scripts]
httptap = "httptap.cli:main"

[project.urls]
Homepage = "https://github.com/ozeranskii/httptap"
Documentation = "https://docs.httptap.dev"
Repository = "https://github.com/ozeranskii/httptap.git"
Issues = "https://github.com/ozeranskii/httptap/issues"
Changelog = "https://github.com/ozeranskii/httptap/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.10.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "typing"},
    {include-group = "test"},
    {include-group = "precommit"},
    {include-group = "e2e"},
]

typing = [
    "mypy>=2.3.1",
    "argcomplete>=3.7.2",
]

test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-httpx>=0.36.0",
    "faker>=40.37.0",
    "pytest-codspeed>=5.0.3",
    "hypothesis>=6.165.10",
    "packaging>=24.0",
]

lint = [
    "ruff>=0.16.4",
]

docs = [
    "mkdocs-material[imaging]>=9.7.1",
    "mkdocs-static-i18n>=1.3.1",
    "mkdocs-git-revision-date-localized-plugin>=1.5.4",
    "mkdocs-redirects>=1.2.3",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-minify-plugin>=0.8.0",
    "pymdown-extensions>=11.0.2",
]
release = [
    "argparse-manpage>=4.7",
    "git-cliff>=2.14.2",
    "twine>=7.0.0",
]
audit = [
    "pip-audit>=2.10.1",
]
# Not installed anywhere: astral-sh/setup-uv reads the uv version to install
# from uv.lock, so CI uses the locked uv and Dependabot bumps it.
ci = [
    "uv>=0.12.23",
]
precommit = [
    "pre-commit>=4.6.2",
]
e2e = [
    "cryptography>=50.0.2",
    "opentelemetry-proto>=1.45.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "D203",
    "D213",
    "COM812",
    "CPY001",  # flake8-copyright: project does not use per-file copyright notices
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "SLF001",  # Private member accessed (allowed in tests)
    "ARG001",  # Unused function argument (mock signatures)
    "PLC0415",  # Import should be at top-level (allowed in test functions)
    "PLR2004",  # Magic value used in comparison (allowed in tests)
    "F841",  # Local variable assigned but never used (test unpacking)
    "D",  # Missing docstring in public function (skip in tests)
    "S101",  # Use of `assert` detected (allowed in tests)
    "ERA001"  # Found commented-out code (allowed in tests)
]
"tests/e2e/**/*.py" = [
    "S105",  # Fake credentials are planted on purpose to check that httptap redacts them
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's defaults plus tests/e2e: the end-to-end suite drives an installed
# httptap executable and only runs when its path is given explicitly.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "tests/e2e"]
filterwarnings = ["error"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=httptap",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
    "--junitxml=junit.xml",
    "-o", "junit_family=legacy"
]

[tool.coverage.run]
source = ["httptap"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "def __hash__",
    "def __eq__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "^\\s*pass$",
    "class .+Protocol",
]

[tool.typos.default]
# git-cliff writes short commit hashes into CHANGELOG.md links; hex fragments
# such as "2daa146" must not be "corrected".
extend-ignore-re = ["\\[[0-9a-f]{7,40}\\]\\(https://github\\.com/[^)]+/commit/[0-9a-f]{40}\\)"]

[tool.typos.default.extend-words]
certifi = "certifi"
wrk = "wrk"

[tool.typos.files]
extend-exclude = [
    ".gitignore",
    "mkdocs.yml",
    "*.zh.md",
    "*.ja.md",
    "*.es.md",
    "README.*.md",
]
