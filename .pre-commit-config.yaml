repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args:
          - --fix
          - --show-fixes
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b # frozen: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies:
          - rich
          - httpx
        args:
          - --strict
          - --ignore-missing-imports
        files: ^httptap/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-docstring-first
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: debug-statements
      - id: check-merge-conflict
      - id: name-tests-test
        args:
          - --pytest-test-first
        # Support modules of the end-to-end harness, not test modules.
        exclude: ^tests/e2e/(certs|harness|servers)\.py$
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
        name: yamlfmt (YAML formatter)
        files: (^|/).*\.ya?ml$
        args:
          - "--conf"
          - ".yamlfmt"
  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b # frozen: v1.51.1
    hooks:
      - id: typos
